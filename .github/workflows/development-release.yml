name: Development Release

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: development-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-development:
    # Only dev can publish the mutable Development channel; no other branch may replace its release.
    if: github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    # Includes full frontend/.NET tests, two Windows runtime smokes, two self-contained
    # publishes, artifact verification, upload and a published-package checksum round trip.
    # A 20-minute cap cancelled a passing build at the desktop startup smoke in P2 batch 1.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node for modern Manor frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install modern frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Test modern frontend
        working-directory: frontend
        run: npm test

      - name: Build modern frontend
        working-directory: frontend
        run: npm run build

      # Export after Vite rebuilds dist, and before MSBuild globs package it.
      - name: Cache single-threaded Godot Web and Windows templates
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.5.1.stable
          key: manor-godot-4.5.1-web-nothreads-windows-v1

      - name: Import, smoke-test and export Godot Manor bonus for WebView2
        shell: pwsh
        run: ./tools/build_manor_bonus_web.ps1 -OutputDirectory frontend/dist/manor3d

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve development version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $baseVersion = [string]$props.Project.PropertyGroup.VersionPrefix
          if ([string]::IsNullOrWhiteSpace($baseVersion)) {
            throw "Directory.Build.props does not define VersionPrefix."
          }
          $version = "$baseVersion-dev.${{ github.run_number }}"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Repository documentation and release guard
        run: python tools/check_repo_contract.py

      - name: Localization resource parity
        run: python tools/check_localization.py

      - name: Migrated German shell coverage
        run: python tools/check_localization_coverage.py --strict-shell

      - name: Adventure localization sanity checks
        run: python tools/check_adventure_localization.py

      - name: Collection artwork coverage
        run: python -X warn_default_encoding -W error::EncodingWarning tools/check_collection_art.py

      - name: Restore
        run: dotnet restore BlackjackCasino.sln

      - name: Build
        run: dotnet build BlackjackCasino.sln --configuration Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test BlackjackCasino.sln --configuration Release --no-build

      - name: WPF-free native shell protocol and storage smoke
        run: dotnet run --project src/BlackjackCasino.NativeShell/BlackjackCasino.NativeShell.csproj --configuration Release --no-build -- --smoke

      - name: Native host migration and isolated storage regression
        run: dotnet run --project src/BlackjackCasino.NativeShell/BlackjackCasino.NativeShell.csproj --configuration Release --no-build -- --web-smoke

      - name: Shared controls regression contract
        run: python tools/check_control_templates.py --self-test

      - name: Casino presentation runtime regression
        shell: pwsh
        run: |
          $output = "artifacts/presentation-regression"
          New-Item -ItemType Directory -Force $output | Out-Null
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $log = Join-Path $output "attempt-$attempt.log"
            dotnet run --project tools/PresentationSmoke --configuration Release -- "$output/attempt-$attempt" 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -eq 0) { exit 0 }
            # Retry only a transient initial WebView2 readiness failure. All
            # other presentation assertions must fail the release immediately.
            if ($attempt -eq 1 -and (Select-String -Path $log -SimpleMatch "Cannot capture lobby artwork: React WebView2 did not become ready." -Quiet)) {
              Write-Warning "Lobby browser startup failed; retrying the complete presentation smoke once."
              continue
            }
            throw "Casino presentation regression failed (exit $code). See $log."
          }

      - name: Desktop startup, Nine Lives and Kniffel smoke
        # An actual startup deadlock must fail this step explicitly instead of
        # exhausting the entire development publishing job without diagnostics.
        timeout-minutes: 18
        run: dotnet run --project tools/StartupSmoke/StartupSmoke.csproj --configuration Release -- artifacts/startup-smoke

      - name: Upload startup smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-startup-smoke
          path: artifacts/startup-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload casino presentation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: casino-presentation-regression
          path: artifacts/presentation-regression
          if-no-files-found: ignore
          retention-days: 14

      - name: Windows Manor runtime acceptance smoke
        shell: pwsh
        run: |
          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $attemptOutput = "artifacts/manor-development-smoke/attempt-$attempt"
            Write-Host "Running Manor smoke attempt $attempt of $maxAttempts..."
            dotnet run --project tools/ManorSmoke/ManorSmoke.csproj --configuration Release -- $attemptOutput
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Manor smoke passed on attempt $attempt."
              exit 0
            }
            Write-Warning "Manor smoke attempt $attempt failed with exit code $LASTEXITCODE."
          }
          throw "Manor runtime smoke failed on all $maxAttempts attempts."

      - name: Upload Manor runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manor-development-smoke
          path: artifacts/manor-development-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish updater and desktop
        shell: pwsh
        run: |
          dotnet publish src/BlackjackCasino.Updater/BlackjackCasino.Updater.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            --output artifacts/updater

          dotnet publish src/BlackjackCasino.Desktop/BlackjackCasino.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            --output artifacts/app

          New-Item -ItemType Directory -Path artifacts/app/tools/updater -Force | Out-Null
          Copy-Item artifacts/updater/BlackjackCasino.Updater.exe artifacts/app/tools/updater/BlackjackCasino.Updater.exe

      - name: Cache Godot Windows export template
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.5.1.stable
          key: godot-4.5.1-windows-x86_64-release-template-v1

      - name: Export and smoke-test Godot Midnight Descent
        shell: pwsh
        run: ./tools/build_midnight_descent.ps1 -OutputDirectory artifacts/app/MidnightDescent

      - name: Build isolated native host migration candidate
        shell: pwsh
        run: |
          dotnet publish src/BlackjackCasino.NativeShell/BlackjackCasino.NativeShell.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            --output artifacts/native-host-candidate
          # The chooser is a separate WPF-free executable and defaults to WPF.
          # It is deliberately NOT copied into the regular updater package.
          dotnet publish tools/HostCutoverLauncher/HostCutoverLauncher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            --output artifacts/host-cutover-launcher
          Copy-Item artifacts/host-cutover-launcher/BlackjackCasino.HostCutoverLauncher.exe artifacts/native-host-candidate/BlackjackCasino.HostCutoverLauncher.exe
          Copy-Item artifacts/app/MidnightDescent artifacts/native-host-candidate/MidnightDescent -Recurse -Force
          foreach ($page in @("lobby.html", "blackjack.html", "roulette.html", "empire.html",
              "lounge.html", "reels.html", "neon-vault.html", "nine-lives.html",
              "midnight-merge.html", "midnight-dice.html", "index.html")) {
            if (!(Test-Path "artifacts/native-host-candidate/ModernFrontend/$page")) {
              throw "Native host candidate lacks packaged $page"
            }
          }
          foreach ($asset in @("index.html", "index.js", "index.wasm", "index.pck")) {
            if (!(Test-Path "artifacts/native-host-candidate/ModernFrontend/manor3d/$asset")) {
              throw "Native host candidate lacks packaged Manor 3D $asset"
            }
          }
          if (!(Test-Path artifacts/native-host-candidate/MidnightDescent/MidnightDescent.exe) -or
              !(Test-Path artifacts/native-host-candidate/MidnightDescent/MidnightDescent.pck)) {
            throw "Native host candidate lacks Midnight Descent"
          }

      - name: Prepare reversible dual-host cutover rehearsal (not updater)
        shell: pwsh
        run: ./tools/build_host_cutover_rehearsal.ps1 -LegacyDirectory artifacts/app -NativeDirectory artifacts/native-host-candidate -OutputDirectory artifacts/host-cutover-rehearsal

      - name: Upload dual-host cutover rehearsal (not updater release)
        uses: actions/upload-artifact@v7
        with:
          name: blackjack-casino-dual-host-cutover-rehearsal-win-x64
          path: artifacts/host-cutover-rehearsal
          if-no-files-found: error
          retention-days: 7

      - name: Upload isolated native host candidate (not updater release)
        uses: actions/upload-artifact@v7
        with:
          name: blackjack-casino-host-migration-candidate-win-x64
          path: artifacts/native-host-candidate
          if-no-files-found: error
          retention-days: 14

      - name: Enable managed NativeShell as Development default (stable unchanged)
        shell: pwsh
        run: ./tools/package_managed_dev_host.ps1 -LegacyDirectory artifacts/app -NativeDirectory artifacts/native-host-candidate

      - name: Verify bundled Midnight Manor frontend assets
        shell: pwsh
        run: |
          $index = "artifacts/app/ModernFrontend/index.html"
          foreach ($asset in @("index.html", "index.js", "index.wasm", "index.pck")) {
            $resource = Join-Path "artifacts/app/ModernFrontend/manor3d" $asset
            if (!(Test-Path $resource)) { throw "Packaged Godot 3D bonus resource missing: $resource" }
          }
          $assets = "artifacts/app/ModernFrontend/assets"
          if (!(Test-Path $index)) { throw "Modern Manor index.html was not packaged." }
          if (!(Test-Path $assets)) { throw "Modern Manor bundles were not packaged." }
          $javascript = Get-ChildItem $assets -Filter "*.js" -File
          if (!$javascript) { throw "Modern Manor JavaScript bundle missing." }
          $reelsEntry = "artifacts/app/ModernFrontend/reels.html"
          if (!(Test-Path $reelsEntry)) { throw "Packaged Reels HTML entry missing." }
          $references = [regex]::Matches((Get-Content $reelsEntry -Raw), '(?:src|href)="(?:\./)?assets/([^"]+)"')
          if (!(@($references | Where-Object { $_.Groups[1].Value.EndsWith(".js") }).Count)) {
            throw "Packaged Reels HTML does not reference its compiled JavaScript."
          }
          foreach ($reference in $references) {
            $resource = Join-Path "artifacts/app/ModernFrontend/assets" $reference.Groups[1].Value
            if (!(Test-Path $resource)) { throw "Packaged Reels resource missing: $resource" }
          }

      - name: Verify published single-file Empire artwork
        shell: pwsh
        run: ./tools/verify_published_artwork.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/published-artwork-smoke

      - name: Upload published artwork evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-artwork-smoke
          path: artifacts/published-artwork-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate installed release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = ""
          $raw = gh release view development --json targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0 -and $raw) {
            $previous = [string](($raw | ConvertFrom-Json).targetCommitish)
          }
          python tools/generate_release_notes.py --version $env:VERSION --channel development --previous-ref "$previous" --output-json artifacts/release-notes.json --output-markdown artifacts/release-notes.md
          Copy-Item artifacts/release-notes.json artifacts/app/release-notes.json

      - name: Package development build
        shell: pwsh
        run: |
          $appVersion = (Get-Item "artifacts/app/BlackjackCasino.Desktop.exe").VersionInfo.ProductVersion.Split('+')[0]
          if ($appVersion -ne $env:VERSION) {
            throw "Packaged application version $appVersion does not match manifest version $env:VERSION."
          }
          $package = Join-Path $PWD "artifacts/blackjack-casino-win-x64.zip"
          Compress-Archive -Path "artifacts/app/*" -DestinationPath $package -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $package -Algorithm SHA256).Hash
          $size = (Get-Item $package).Length
          $repo = "${{ github.repository }}"

          $manifest = [ordered]@{
            schemaVersion = 1
            version = $env:VERSION
            channel = "development"
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            minimumUpdaterVersion = "0.1.0-preview.1"
            package = [ordered]@{
              # Version-specific CDN cache key: the Development release tag
              # is mutable and the asset keeps its name after replacement.
              # A stale cached manifest must never silently select another build.
              url = "https://github.com/$repo/releases/download/development/blackjack-casino-win-x64.zip?revision=$env:VERSION"
              sha256 = $hash
              sizeBytes = $size
            }
            notesUrl = "https://github.com/$repo/releases/tag/development"
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "artifacts/update-manifest.json" -Encoding utf8NoBOM
          "$hash  blackjack-casino-win-x64.zip" | Set-Content -Path "artifacts/blackjack-casino-win-x64.zip.sha256" -Encoding ascii

      - name: Publish mutable development channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view development *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete development --yes --cleanup-tag
          }

          gh release create development `
            --target "${{ github.sha }}" `
            --prerelease `
            --title "Blackjack Casino Development $env:VERSION" `
            --notes-file "artifacts/release-notes.md" `
            "artifacts/blackjack-casino-win-x64.zip" `
            "artifacts/blackjack-casino-win-x64.zip.sha256" `
            "artifacts/update-manifest.json" `
            "artifacts/release-notes.json"

      - name: Verify published Development channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view development --json tagName,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect published Development release." }
          if ($release.targetCommitish -ne "${{ github.sha }}") { throw "Development target does not match the built commit." }
          foreach ($asset in @("blackjack-casino-win-x64.zip", "blackjack-casino-win-x64.zip.sha256", "update-manifest.json", "release-notes.json")) {
            if ($asset -notin $release.assets.name) { throw "Missing Development asset: $asset" }
          }

          $verifyDir = "artifacts/published-development-verification"
          gh release download development --dir $verifyDir --pattern "update-manifest.json" --pattern "blackjack-casino-win-x64.zip" --pattern "blackjack-casino-win-x64.zip.sha256" --pattern "release-notes.json"
          if ($LASTEXITCODE -ne 0) { throw "Could not download the published Development assets." }
          $manifest = Get-Content "$verifyDir/update-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.notesUrl -ne "https://github.com/${{ github.repository }}/releases/tag/development") { throw "Published manifest points to another release." }
          $publishedNotes = Get-Content "$verifyDir/release-notes.json" -Raw | ConvertFrom-Json
          if ($publishedNotes.version -ne $env:VERSION -or $publishedNotes.channel -ne "development") { throw "Published notes version/channel mismatch." }
          if ($manifest.version -ne $env:VERSION -or $manifest.channel -ne "development") { throw "Published manifest version/channel mismatch." }
          $expectedPackageUrl = "https://github.com/${{ github.repository }}/releases/download/development/blackjack-casino-win-x64.zip?revision=$env:VERSION"
          if ($manifest.package.url -ne $expectedPackageUrl) { throw "Published manifest URL does not pin this Development build's cache key." }
          $publishedPackage = Get-Item "$verifyDir/blackjack-casino-win-x64.zip"
          $publishedHash = (Get-FileHash $publishedPackage.FullName -Algorithm SHA256).Hash
          if ($publishedHash -ne $manifest.package.sha256 -or $publishedPackage.Length -ne $manifest.package.sizeBytes) { throw "Published package hash/size mismatch." }
          $checksum = (Get-Content "$verifyDir/blackjack-casino-win-x64.zip.sha256" -Raw).Split(' ')[0]
          if ($checksum -ne $publishedHash) { throw "Published checksum asset mismatch." }
          Write-Host "Verified published Development $env:VERSION at ${{ github.sha }} (SHA-256 and size)."
