name: Development Release

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: development-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-development:
    # Only dev can publish the mutable Development channel; no other branch may replace its release.
    if: github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    # Includes frontend/.NET tests, real native WinForms/WebView2 runtime smokes,
    # direct NativeShell publish and an updater/checksum round trip.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node for modern Manor frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install modern frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Test modern frontend
        working-directory: frontend
        run: npm test

      - name: Build modern frontend
        working-directory: frontend
        run: npm run build

      # Export after Vite rebuilds dist, and before MSBuild globs package it.
      - name: Cache single-threaded Godot Web and Windows templates
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.5.1.stable
          key: manor-godot-4.5.1-web-nothreads-windows-v1

      - name: Import, smoke-test and export Godot Manor bonus for WebView2
        shell: pwsh
        run: ./tools/build_manor_bonus_web.ps1 -OutputDirectory frontend/dist/manor3d

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve development version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $baseVersion = [string]$props.Project.PropertyGroup.VersionPrefix
          if ([string]::IsNullOrWhiteSpace($baseVersion)) {
            throw "Directory.Build.props does not define VersionPrefix."
          }
          $version = "$baseVersion-dev.${{ github.run_number }}"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Repository documentation and release guard
        run: python tools/check_repo_contract.py

      - name: Localization resource parity
        run: python tools/check_localization.py

      - name: Native German content coverage
        run: python tools/check_localization_coverage.py --strict-shell

      - name: Adventure localization sanity checks
        run: python tools/check_adventure_localization.py

      - name: Collection artwork coverage
        run: python -X warn_default_encoding -W error::EncodingWarning tools/check_collection_art.py

      - name: Restore
        run: dotnet restore BlackjackCasino.sln

      - name: Build
        run: dotnet build BlackjackCasino.sln --configuration Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test BlackjackCasino.sln --configuration Release --no-build

      - name: WPF-free native shell protocol and storage smoke
        run: dotnet run --project src/BlackjackCasino.NativeShell/BlackjackCasino.NativeShell.csproj --configuration Release --no-build -- --smoke

      - name: Native host migration and isolated storage regression
        run: dotnet run --project src/BlackjackCasino.NativeShell/BlackjackCasino.NativeShell.csproj --configuration Release --no-build -- --web-smoke

      - name: Native-only production cutover contract
        run: python tools/check_native_cutover.py

      - name: Publish updater
        shell: pwsh
        run: |
          dotnet publish src/BlackjackCasino.Updater/BlackjackCasino.Updater.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            --output artifacts/updater

      - name: Publish native Windows casino
        shell: pwsh
        run: |
          dotnet publish src/BlackjackCasino.NativeShell/BlackjackCasino.NativeShell.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            --output artifacts/app

          # A pre-cutover updater still requires Desktop.exe to be in the
          # incoming ZIP. This tiny WinForms shim is NOT WPF and delegates to
          # NativeShell; old shortcuts and atomic recovery remain functional.
          dotnet publish src/BlackjackCasino.CompatLauncher/BlackjackCasino.CompatLauncher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            --output artifacts/compat-launcher
          Copy-Item artifacts/compat-launcher/BlackjackCasino.Desktop.exe artifacts/app/BlackjackCasino.Desktop.exe
          New-Item -ItemType Directory -Path artifacts/app/tools/updater -Force | Out-Null
          Copy-Item artifacts/updater/BlackjackCasino.Updater.exe artifacts/app/tools/updater/BlackjackCasino.Updater.exe

      - name: Cache Godot Windows export template
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.5.1.stable
          key: godot-4.5.1-windows-x86_64-release-template-v1

      - name: Export and smoke-test Godot Midnight Descent
        shell: pwsh
        run: ./tools/build_midnight_descent.ps1 -OutputDirectory artifacts/app/MidnightDescent

      - name: Verify native package and frontend inventory
        shell: pwsh
        run: |
          foreach ($page in @("lobby.html", "blackjack.html", "roulette.html",
              "empire.html", "lounge.html", "reels.html", "neon-vault.html",
              "nine-lives.html", "midnight-merge.html", "midnight-dice.html", "index.html")) {
            if (!(Test-Path "artifacts/app/ModernFrontend/$page")) {
              throw "NativeShell package lacks: $page"
            }
          }
          foreach ($asset in @("index.html", "index.js", "index.wasm", "index.pck")) {
            if (!(Test-Path "artifacts/app/ModernFrontend/manor3d/$asset")) {
              throw "NativeShell package lacks Manor 3D: $asset"
            }
          }
          foreach ($file in @("BlackjackCasino.NativeShell.exe", "BlackjackCasino.Desktop.exe",
              "tools/updater/BlackjackCasino.Updater.exe", "MidnightDescent/MidnightDescent.exe",
              "MidnightDescent/MidnightDescent.pck")) {
            if (!(Test-Path "artifacts/app/$file")) { throw "Native package lacks: $file" }
          }
          if (Test-Path artifacts/app/native-development-default.flag) {
            throw "Obsolete WPF redirection marker must not ship with the native release."
          }

      - name: Verify published native artwork and licensed soundtracks
        shell: pwsh
        run: ./tools/verify_published_artwork.ps1 -AppDirectory artifacts/app -OutputDirectory artifacts/published-artwork-smoke

      - name: Upload native packaged artwork evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-artwork-smoke
          path: artifacts/published-artwork-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate installed release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = ""
          $raw = gh release view development --json targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0 -and $raw) {
            $previous = [string](($raw | ConvertFrom-Json).targetCommitish)
          }
          python tools/generate_release_notes.py --version $env:VERSION --channel development --previous-ref "$previous" --output-json artifacts/release-notes.json --output-markdown artifacts/release-notes.md
          Copy-Item artifacts/release-notes.json artifacts/app/release-notes.json

      - name: Package development build
        shell: pwsh
        run: |
          $appVersion = (Get-Item "artifacts/app/BlackjackCasino.NativeShell.exe").VersionInfo.ProductVersion.Split('+')[0]
          if ($appVersion -ne $env:VERSION) {
            throw "Packaged application version $appVersion does not match manifest version $env:VERSION."
          }
          $package = Join-Path $PWD "artifacts/blackjack-casino-win-x64.zip"
          Compress-Archive -Path "artifacts/app/*" -DestinationPath $package -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $package -Algorithm SHA256).Hash
          $size = (Get-Item $package).Length
          $repo = "${{ github.repository }}"

          $manifest = [ordered]@{
            schemaVersion = 1
            version = $env:VERSION
            channel = "development"
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            minimumUpdaterVersion = "0.1.0-preview.1"
            package = [ordered]@{
              # Version-specific CDN cache key: the Development release tag
              # is mutable and the asset keeps its name after replacement.
              # A stale cached manifest must never silently select another build.
              url = "https://github.com/$repo/releases/download/development/blackjack-casino-win-x64.zip?revision=$env:VERSION"
              sha256 = $hash
              sizeBytes = $size
            }
            notesUrl = "https://github.com/$repo/releases/tag/development"
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "artifacts/update-manifest.json" -Encoding utf8NoBOM
          "$hash  blackjack-casino-win-x64.zip" | Set-Content -Path "artifacts/blackjack-casino-win-x64.zip.sha256" -Encoding ascii

      - name: Publish mutable development channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view development *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete development --yes --cleanup-tag
          }

          gh release create development `
            --target "${{ github.sha }}" `
            --prerelease `
            --title "Blackjack Casino Development $env:VERSION" `
            --notes-file "artifacts/release-notes.md" `
            "artifacts/blackjack-casino-win-x64.zip" `
            "artifacts/blackjack-casino-win-x64.zip.sha256" `
            "artifacts/update-manifest.json" `
            "artifacts/release-notes.json"

      - name: Verify published Development channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view development --json tagName,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect published Development release." }
          if ($release.targetCommitish -ne "${{ github.sha }}") { throw "Development target does not match the built commit." }
          foreach ($asset in @("blackjack-casino-win-x64.zip", "blackjack-casino-win-x64.zip.sha256", "update-manifest.json", "release-notes.json")) {
            if ($asset -notin $release.assets.name) { throw "Missing Development asset: $asset" }
          }

          $verifyDir = "artifacts/published-development-verification"
          gh release download development --dir $verifyDir --pattern "update-manifest.json" --pattern "blackjack-casino-win-x64.zip" --pattern "blackjack-casino-win-x64.zip.sha256" --pattern "release-notes.json"
          if ($LASTEXITCODE -ne 0) { throw "Could not download the published Development assets." }
          $manifest = Get-Content "$verifyDir/update-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.notesUrl -ne "https://github.com/${{ github.repository }}/releases/tag/development") { throw "Published manifest points to another release." }
          $publishedNotes = Get-Content "$verifyDir/release-notes.json" -Raw | ConvertFrom-Json
          if ($publishedNotes.version -ne $env:VERSION -or $publishedNotes.channel -ne "development") { throw "Published notes version/channel mismatch." }
          if ($manifest.version -ne $env:VERSION -or $manifest.channel -ne "development") { throw "Published manifest version/channel mismatch." }
          $expectedPackageUrl = "https://github.com/${{ github.repository }}/releases/download/development/blackjack-casino-win-x64.zip?revision=$env:VERSION"
          if ($manifest.package.url -ne $expectedPackageUrl) { throw "Published manifest URL does not pin this Development build's cache key." }
          $publishedPackage = Get-Item "$verifyDir/blackjack-casino-win-x64.zip"
          $publishedHash = (Get-FileHash $publishedPackage.FullName -Algorithm SHA256).Hash
          if ($publishedHash -ne $manifest.package.sha256 -or $publishedPackage.Length -ne $manifest.package.sizeBytes) { throw "Published package hash/size mismatch." }
          $checksum = (Get-Content "$verifyDir/blackjack-casino-win-x64.zip.sha256" -Raw).Split(' ')[0]
          if ($checksum -ne $publishedHash) { throw "Published checksum asset mismatch." }
          Write-Host "Verified published Development $env:VERSION at ${{ github.sha }} (SHA-256 and size)."
