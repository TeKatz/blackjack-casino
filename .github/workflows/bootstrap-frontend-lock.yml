name: Generate deterministic frontend lockfile

on:
  push:
    branches: ["feature/manor-modernization-phase-1"]
    paths:
      - ".github/workflows/bootstrap-frontend-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and verify complete dependency tree
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Commit lockfile to the migration branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(frontend): pin complete npm dependency graph"
            git push origin HEAD:feature/manor-modernization-phase-1
          fi
