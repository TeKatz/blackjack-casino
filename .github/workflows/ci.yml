name: CI

on:
  push:
    branches: [main, dev, "feature/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Repository documentation and release guard
        run: python tools/check_repo_contract.py

      - name: React and legacy WPF separation audit
        run: python tools/check_ui_migration_boundaries.py

      - name: Phase A host migration parity and isolation guard
        run: python tools/check_host_phase_a.py

      - name: Setup Node for modern Manor frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install modern frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Test modern frontend
        working-directory: frontend
        run: npm test

      - name: Build modern frontend
        working-directory: frontend
        run: npm run build

      # Export after Vite rebuilds dist, and before MSBuild globs package it.
      - name: Cache single-threaded Godot Web and Windows templates
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.5.1.stable
          key: manor-godot-4.5.1-web-nothreads-windows-v1

      - name: Import, smoke-test and export Godot Manor bonus for WebView2
        shell: pwsh
        run: ./tools/build_manor_bonus_web.ps1 -OutputDirectory frontend/dist/manor3d

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve preview version
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $baseVersion = [string]$props.Project.PropertyGroup.VersionPrefix
          if ([string]::IsNullOrWhiteSpace($baseVersion)) {
            throw "Directory.Build.props does not define VersionPrefix."
          }
          "PREVIEW_VERSION=$baseVersion-dev.0" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Localization resource parity
        run: python tools/check_localization.py

      - name: Migrated German shell coverage
        run: python tools/check_localization_coverage.py --strict-shell

      - name: Adventure localization sanity checks
        run: python tools/check_adventure_localization.py

      - name: Versioned release-notes smoke
        shell: pwsh
        run: |
          python tools/generate_release_notes.py --version 0.10.1-dev.0 --channel development --output-json artifacts/release-notes-ci.json --output-markdown artifacts/release-notes-ci.md
          $notes = Get-Content artifacts/release-notes-ci.json -Raw | ConvertFrom-Json
          if ($notes.version -ne "0.10.1-dev.0" -or $notes.channel -ne "development" -or $notes.changes.Count -lt 1) {
            throw "Generated changelog has incorrect version, channel, or missing entries."
          }
          if (!(Test-Path artifacts/release-notes-ci.md)) { throw "Missing Markdown changelog." }
          foreach ($change in $notes.changes) {
            if ([string]::IsNullOrWhiteSpace($change.titleDe) -or [string]::IsNullOrWhiteSpace($change.descriptionDe)) {
              throw "Generated changelog entry is missing German editorial text."
            }
          }

      - name: Collection artwork coverage
        run: python -X warn_default_encoding -W error::EncodingWarning tools/check_collection_art.py

      - name: Empire artwork integrity
        run: python -X warn_default_encoding -W error::EncodingWarning tools/check_empire_art.py

      - name: Restore
        run: dotnet restore BlackjackCasino.sln

      - name: Build
        run: dotnet build BlackjackCasino.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BlackjackCasino.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: WPF-free native shell protocol and storage smoke
        run: dotnet run --project src/BlackjackCasino.NativeShell/BlackjackCasino.NativeShell.csproj --configuration Release --no-build -- --smoke

      - name: WPF-free native shell real WebView2 startup and seven React routes
        run: dotnet run --project src/BlackjackCasino.NativeShell/BlackjackCasino.NativeShell.csproj --configuration Release --no-build -- --web-smoke

      - name: Shared controls regression contract
        run: python tools/check_control_templates.py --self-test

      - name: Modern Blackjack controller regression
        run: dotnet test tests/BlackjackCasino.Tests/BlackjackCasino.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~BlackjackTableControllerTests"

      - name: Casino presentation runtime regression
        run: dotnet run --project tools/PresentationSmoke --configuration Release -- artifacts/presentation-regression

      - name: Desktop startup and Nine Lives smoke
        run: dotnet run --project tools/StartupSmoke/StartupSmoke.csproj --configuration Release -- artifacts/startup-smoke

      - name: Upload startup smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-startup-smoke
          path: artifacts/startup-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload casino presentation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: casino-presentation-regression
          path: artifacts/presentation-regression
          if-no-files-found: ignore
          retention-days: 14

      - name: Windows Manor runtime smoke
        run: dotnet run --project tools/ManorSmoke/ManorSmoke.csproj --configuration Release -- artifacts/manor-windows-smoke

      - name: Upload Manor runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manor-windows-runtime-evidence
          path: artifacts/manor-windows-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Render audio audition tracks
        run: dotnet run --project tools/AudioRender --configuration Release -- artifacts/audio-review

      - name: Upload audio review
        uses: actions/upload-artifact@v7
        with:
          name: casino-audio-review
          path: artifacts/audio-review
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Publish preview updater
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          dotnet publish src/BlackjackCasino.Updater/BlackjackCasino.Updater.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:PREVIEW_VERSION `
            --output artifacts/preview-updater

      - name: Publish preview desktop
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          dotnet publish src/BlackjackCasino.Desktop/BlackjackCasino.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:PREVIEW_VERSION `
            --output artifacts/preview-app

          New-Item -ItemType Directory -Path artifacts/preview-app/tools/updater -Force | Out-Null
          Copy-Item artifacts/preview-updater/BlackjackCasino.Updater.exe artifacts/preview-app/tools/updater/BlackjackCasino.Updater.exe

      - name: Cache Godot Windows export template
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.5.1.stable
          key: godot-4.5.1-windows-x86_64-release-template-v1

      - name: Export and smoke-test Godot Midnight Descent
        shell: pwsh
        run: ./tools/build_midnight_descent.ps1 -OutputDirectory artifacts/preview-app/MidnightDescent

      - name: Publish WPF-free native shell preview (not the updater target)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          dotnet publish src/BlackjackCasino.NativeShell/BlackjackCasino.NativeShell.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            --output artifacts/native-shell-preview
          Copy-Item artifacts/preview-app/MidnightDescent artifacts/native-shell-preview/MidnightDescent -Recurse -Force
          foreach ($name in @("lobby.html", "blackjack.html", "roulette.html", "empire.html", "reels.html", "neon-vault.html", "nine-lives.html", "midnight-merge.html", "midnight-dice.html", "index.html")) {
            if (!(Test-Path "artifacts/native-shell-preview/ModernFrontend/$name")) {
              throw "Native shell is missing packaged $name"
            }
          }
          if (!(Test-Path artifacts/native-shell-preview/MidnightDescent/MidnightDescent.exe) -or
              !(Test-Path artifacts/native-shell-preview/MidnightDescent/MidnightDescent.pck)) {
            throw "Native shell preview is missing packaged Midnight Descent Godot runtime"
          }

      - name: Upload independent WPF-free native shell preview
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: blackjack-casino-native-shell-preview-win-x64
          path: artifacts/native-shell-preview
          if-no-files-found: error
          retention-days: 14

      - name: Verify bundled Midnight Manor frontend assets
        shell: pwsh
        run: |
          $index = "artifacts/preview-app/ModernFrontend/index.html"
          $assets = "artifacts/preview-app/ModernFrontend/assets"
          if (!(Test-Path $index)) { throw "Modern Manor index.html was not packaged." }
          if (!(Test-Path $assets)) { throw "Modern Manor bundles were not packaged." }
          $javascript = Get-ChildItem $assets -Filter "*.js" -File
          if (!$javascript) { throw "Modern Manor JavaScript bundle missing." }
          $reelsEntry = "artifacts/preview-app/ModernFrontend/reels.html"
          if (!(Test-Path $reelsEntry)) { throw "Packaged Reels HTML entry missing." }
          $references = [regex]::Matches((Get-Content $reelsEntry -Raw), '(?:src|href)="(?:\./)?assets/([^"]+)"')
          if (!(@($references | Where-Object { $_.Groups[1].Value.EndsWith(".js") }).Count)) {
            throw "Packaged Reels HTML does not reference its compiled JavaScript."
          }
          foreach ($reference in $references) {
            $resource = Join-Path "artifacts/preview-app/ModernFrontend/assets" $reference.Groups[1].Value
            if (!(Test-Path $resource)) { throw "Packaged Reels resource missing: $resource" }
          }

      - name: Verify published single-file Empire artwork
        shell: pwsh
        run: ./tools/verify_published_artwork.ps1 -AppDirectory artifacts/preview-app -OutputDirectory artifacts/published-artwork-smoke

      - name: Upload published artwork evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-artwork-smoke
          path: artifacts/published-artwork-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows preview
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: blackjack-casino-preview-win-x64
          path: artifacts/preview-app
          if-no-files-found: error
          retention-days: 14

  published-artwork:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build local frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish actual single-file desktop
        run: dotnet publish src/BlackjackCasino.Desktop/BlackjackCasino.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o artifacts/single-file-app
      - name: Decode embedded and browser artwork in published executable
        shell: pwsh
        run: ./tools/verify_published_artwork.ps1 -AppDirectory artifacts/single-file-app -OutputDirectory artifacts/single-file-artwork-smoke
      - name: Upload packaged regression result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: single-file-artwork-regression
          path: artifacts/single-file-artwork-smoke
          if-no-files-found: ignore
          retention-days: 14
