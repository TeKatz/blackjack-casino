name: Midnight Industries Poly Haven terrain import

on:
  push:
    branches: [dev]
    paths:
      - 'games/midnight-industries/tools/import_polyhaven_terrain.py'
      - '.github/workflows/industries-polyhaven-terrain.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: industries-polyhaven-terrain-import
  cancel-in-progress: false

jobs:
  import-ground:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout desktop development branch
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true

      - name: Download original 1K diffuse textures from official Poly Haven API
        run: python3 games/midnight-industries/tools/import_polyhaven_terrain.py

      - name: Commit verified CC0 texture assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- games/midnight-industries/assets/grass_ground_diff_1k.jpg \
            games/midnight-industries/assets/rocks_ground_05_diff_1k.jpg
          if git diff --cached --quiet; then
            echo "Terrain textures already match upstream."
          else
            git commit -m "assets(industries): bundle CC0 grass and rocky ground diffuse maps"
            git push origin HEAD:refs/heads/dev
          fi
