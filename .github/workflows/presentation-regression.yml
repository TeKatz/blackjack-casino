name: Casino presentation regression
on:
  push:
    branches: [main, dev, "feature/**", "fix/**", "migration/**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  hover-and-layout:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install modern presentation dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validate modern presentation
        working-directory: frontend
        run: npm test
      - name: Build packaged modern presentations
        working-directory: frontend
        run: npm run build
      - name: Native-only architecture guard
        run: python tools/check_native_cutover.py
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Collection artwork coverage
        run: python -X warn_default_encoding -W error::EncodingWarning tools/check_collection_art.py

      - name: Native WebView2 hover, focus, lobby return and game-route regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/presentation-regression -Force | Out-Null
          dotnet run --project src/BlackjackCasino.NativeShell/BlackjackCasino.NativeShell.csproj --configuration Release -- --web-smoke 2>&1 |
            Tee-Object -FilePath artifacts/presentation-regression/native-web-smoke.log
          if ($LASTEXITCODE -ne 0) { throw "Native WebView2 presentation regression failed." }
      - name: Upload native runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: casino-presentation-regression
          path: artifacts/presentation-regression
          if-no-files-found: ignore
          retention-days: 14
