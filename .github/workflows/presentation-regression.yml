name: Casino presentation regression
on:
  push:
    branches: [main, "feature/**", "fix/**", "slots/midnight-manor"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  hover-and-layout:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install modern presentation dependencies
        working-directory: frontend
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate modern presentation
        working-directory: frontend
        run: npm test
      - name: Build packaged modern presentations
        working-directory: frontend
        run: npm run build
      - name: Reject unsafe dropdown templates
        run: python tools/check_control_templates.py --self-test
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Collection artwork coverage
        run: python -X warn_default_encoding -W error::EncodingWarning tools/check_collection_art.py

      - name: Actual Windows hover and layout regression
        run: dotnet run --project tools/PresentationSmoke --configuration Release -- artifacts/presentation-regression
      - name: Upload screenshots and state evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: casino-presentation-regression
          path: artifacts/presentation-regression
          if-no-files-found: ignore
          retention-days: 14

