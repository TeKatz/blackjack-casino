name: Repository contract

on:
  push:
    branches: [main, dev, "feature/**", "fix/**", "migration/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Repository documentation and release guard
        run: python3 tools/check_repo_contract.py
      - name: Native production host, package and updater contract
        run: python3 tools/check_native_cutover.py
      - name: Casino music importer URL and destination self-test
        run: python3 tools/import_casino_music.py --self-test
