name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag does not contain a supported semantic version: $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore BlackjackCasino.sln

      - name: Build
        run: dotnet build BlackjackCasino.sln --configuration Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test BlackjackCasino.sln --configuration Release --no-build

      - name: Publish updater
        shell: pwsh
        run: |
          dotnet publish src/BlackjackCasino.Updater/BlackjackCasino.Updater.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            --output artifacts/updater

      - name: Publish desktop
        shell: pwsh
        run: |
          dotnet publish src/BlackjackCasino.Desktop/BlackjackCasino.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:Version=$env:VERSION `
            --output artifacts/app

          New-Item -ItemType Directory -Path artifacts/app/tools/updater -Force | Out-Null
          Copy-Item artifacts/updater/BlackjackCasino.Updater.exe artifacts/app/tools/updater/BlackjackCasino.Updater.exe

      - name: Generate installed release notes
        shell: pwsh
        run: |
          python tools/generate_release_notes.py --version $env:VERSION --channel stable --output-json artifacts/release-notes.json --output-markdown artifacts/release-notes.md
          Copy-Item artifacts/release-notes.json artifacts/app/release-notes.json

      - name: Package and create update manifest
        shell: pwsh
        run: |
          $package = Join-Path $PWD "artifacts/blackjack-casino-win-x64.zip"
          Compress-Archive -Path "artifacts/app/*" -DestinationPath $package -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $package -Algorithm SHA256).Hash
          $size = (Get-Item $package).Length
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"

          $manifest = [ordered]@{
            schemaVersion = 1
            version = $env:VERSION
            channel = "stable"
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            minimumUpdaterVersion = "0.1.0-preview.1"
            package = [ordered]@{
              url = "https://github.com/$repo/releases/download/$tag/blackjack-casino-win-x64.zip"
              sha256 = $hash
              sizeBytes = $size
            }
            notesUrl = "https://github.com/$repo/releases/tag/$tag"
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "artifacts/update-manifest.json" -Encoding utf8NoBOM
          "$hash  blackjack-casino-win-x64.zip" | Set-Content -Path "artifacts/blackjack-casino-win-x64.zip.sha256" -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts/blackjack-casino-win-x64.zip" `
            "artifacts/blackjack-casino-win-x64.zip.sha256" `
            "artifacts/update-manifest.json" `
            "artifacts/release-notes.json" `
            --title "Blackjack Casino ${{ github.ref_name }}" `
            --notes-file "artifacts/release-notes.md"
