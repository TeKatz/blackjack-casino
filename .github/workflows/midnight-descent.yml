name: Midnight Descent Godot smoke

on:
  push:
    branches: [develop, main]
    paths:
      - 'games/midnight-descent/**'
      - '.github/workflows/midnight-descent.yml'
  pull_request:
    paths:
      - 'games/midnight-descent/**'
      - '.github/workflows/midnight-descent.yml'

permissions:
  contents: read

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/descent-godot
          chmod +x /tmp/descent-godot/Godot_v4.5.1-stable_linux.x86_64
          echo "/tmp/descent-godot" >> "$GITHUB_PATH"
      - name: Import, parse and exercise both actual scenes
        shell: bash
        run: |
          set -euo pipefail
          godot=Godot_v4.5.1-stable_linux.x86_64
          project=games/midnight-descent
          mkdir -p artifacts/descent-smoke
          run_checked() {
            local name="$1"
            shift
            "$godot" --headless --path "$project" "$@" 2>&1 | tee "artifacts/descent-smoke/$name.log"
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' "artifacts/descent-smoke/$name.log"; then
              echo "::error::Godot script error in $name"
              exit 1
            fi
          }
          run_checked import --editor --import
          run_checked menu --quit-after 240 -- --smoke-test
          grep -Fq "Midnight Descent menu smoke PASS" artifacts/descent-smoke/menu.log
          grep -Fq "Midnight Descent run smoke PASS" artifacts/descent-smoke/menu.log
          run_checked gameplay --quit-after 240 res://run.tscn -- --run-smoke
          grep -Fq "Midnight Descent gameplay scene smoke PASS" artifacts/descent-smoke/gameplay.log
      - name: Upload Godot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midnight-descent-smoke
          path: artifacts/descent-smoke
          if-no-files-found: ignore
