<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/><title>Midnight Dice · The Midnight Club</title><style>
html,body{margin:0;min-height:100%;background:#091316;color:#f3dfb4}
#root{min-height:100vh}
#mode-boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#d1ab7420,transparent 56%),#091316;color:#efd8a5;font-family:Georgia,serif;text-align:center;pointer-events:auto;transition:opacity .24s ease,visibility .24s ease}
#mode-boot[data-state="ready"]{opacity:0;visibility:hidden;pointer-events:none}
#mode-boot .boot-content{max-width:90vw;padding:30px 24px}
#mode-boot .boot-mark{font-size:40px;color:#cba66c;line-height:1.3}
#mode-boot .boot-brand{margin:14px 0 8px;font:600 11px/1.5 "Segoe UI",sans-serif;letter-spacing:.32em;color:#c9b38d}
#mode-boot .boot-title{margin:0;font:normal clamp(26px,4vw,42px)/1.2 Georgia,serif;letter-spacing:.13em;color:#f4dfb1}
#mode-boot .boot-track{width:136px;height:2px;margin:28px auto 0;background:#a68b5940;overflow:hidden}
#mode-boot .boot-track::after{content:"";display:block;width:48px;height:100%;background:#e4bd76;animation:boot-progress 1.6s ease-in-out infinite alternate}
@keyframes boot-progress{from{transform:translateX(0)}to{transform:translateX(88px)}}
@media(prefers-reduced-motion:reduce){#mode-boot{transition:none}#mode-boot .boot-track::after{animation:none;width:100%}}
</style>
</head>
<body>
<section id="mode-boot" role="status" aria-label="Loading MIDNIGHT DICE" data-state="loading"><div class="boot-content"><div class="boot-mark" aria-hidden="true">♠</div><div class="boot-brand">THE MIDNIGHT CLUB</div><h1 class="boot-title">MIDNIGHT DICE</h1><div class="boot-track" aria-hidden="true"></div></div></section><div id="root"></div><script type="module" src="/src/dice/main.tsx"></script></body></html>
