<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#061614"/><title>Casino Empire · The Midnight Club</title></head>
<body>
<div id="root">
  <main style="min-height:100vh;background:#061614;color:#e8dcc0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Segoe UI',sans-serif">
    <h1 style="font:28px Georgia,serif;letter-spacing:.12em">CASINO EMPIRE</h1>
    <p style="color:#aebeae">Opening your estate…</p>
    <button id="empire-boot-back" type="button" style="padding:10px 14px;background:#142d26;color:#e8ece3;border:1px solid #345449;border-radius:6px;cursor:pointer">← Casino lobby</button>
  </main>
</div>
<script>
  // Functional even before the React bundle has finished loading.
  document.getElementById('empire-boot-back')?.addEventListener('click',()=>window.chrome?.webview?.postMessage({type:'empire.close'}));
</script>
<script type="module" src="/src/empire/main.tsx"></script></body>
</html>
